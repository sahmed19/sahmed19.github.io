# Site settings
# This file is NOT reloaded automatically by `bundle exec jekyll serve` — restart the server after editing.

title: Sheehan Ahmed
email: sheehansahmed@gmail.com
role: "Technical artist"
description: >-
  Technical artist
url: "https://www.sheehanahmed.com"
baseurl: ""
github_username: sahmed19
repository: sahmed19/sahmed19.github.io
github: [metadata]


# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /:categories/:title/
timezone: America/Los_Angeles

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.psd"

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-seo-tag
  - jemoji
  - jekyll-include-cache

author:
  name: "Sheehan Ahmed"
  bio: "Technical artist."

# Social links: icon names map to SVGs in _includes/icon.html
social:
  - label: "LinkedIn"
    icon: linkedin
    url: "https://www.linkedin.com/in/sheehan-ahmed-94136b192/"
  - label: "ArtStation"
    icon: artstation
    url: "https://www.artstation.com/wheatpenguin"
  - label: "GitHub"
    icon: github
    url: "https://github.com/sahmed19"

# Link previews (LinkedIn, Slack, etc.)
twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page

comments:
  provider: "utterances"
  utterances:
    repo: sahmed19/sahmed19.github.io
    theme: "github-dark"
    issue_term: "pathname"
    label: "comment"
