<div class="finish container" aria-hidden="true"></div>
<footer class="site-footer">
  <div class="container site-footer__inner">
    <a class="site-footer__mail" href="mailto:{{ site.email }}">{{ site.email }}</a>
    <ul class="social">
      {% for s in site.social %}
        <li><a href="{{ s.url }}" rel="me noopener" target="_blank">{% include icon.html name=s.icon %}<span>{{ s.label }}</span></a></li>
      {% endfor %}
    </ul>
  </div>
  <div class="container site-footer__base">&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</div>
</footer>
