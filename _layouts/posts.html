---
layout: default
---
<header class="page-head container">
    <span class="ghost" aria-hidden="true">{{ page.title | markdownify | strip_html | strip }}</span>
  <h1 class="page-head__title">{{ page.title }}</h1>
</header>
<div class="container group">
  <div class="grid grid--3">
    {% for post in site.posts %}{% include post-card.html post=post %}{% endfor %}
  </div>
</div>
